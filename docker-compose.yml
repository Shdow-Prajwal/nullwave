version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vectorvibe_postgres
    restart: always
    environment:
      POSTGRES_DB: musicdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_local_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
